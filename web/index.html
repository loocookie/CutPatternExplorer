<!doctype html>
<meta charset="utf-8">
<title>Cut Pattern Explorer</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px ui-sans-serif, system-ui, sans-serif;
    background: #fbfbfd; color: #1b1e26;
    display: grid; grid-template-columns: 1fr 340px; height: 100vh;
  }
  /* grid 항목은 min-width/min-height 가 auto 라 내용보다 작아지지 않는다.
     캔버스 내부 해상도(= dpr 배)가 min-content 로 잡히면 열이 넓어지고,
     넓어진 폭으로 다시 내부 해상도를 키우는 되먹임이 생긴다. 고리를 끊는다 */
  #stage, aside { min-width: 0; min-height: 0; }
  #stage { position: relative; overflow: hidden; }
  /* absolute 로 띄워 레이아웃 계산에서 아예 빠지게 한다 */
  canvas { position: absolute; inset: 0; width: 100%; height: 100%;
           display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #stat { position: absolute; left: 16px; bottom: 12px; right: 16px;
          color: #7b8194; font-size: 12px; line-height: 1.5; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center;
          color: #7b8194; background: #fbfbfd; }
  aside { border-left: 1px solid #e3e6ee; padding: 16px; overflow-y: auto;
          display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 13px; margin: 0; letter-spacing: .02em; color: #5b6172; }
  textarea { width: 100%; height: 220px; padding: 10px; resize: vertical;
             font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
             border: 1px solid #dfe3ec; border-radius: 6px; background: #fff;
             tab-size: 4; }
  button { padding: 7px 14px; border: 1px solid #c9cfdd; border-radius: 6px;
           background: #fff; cursor: pointer; font: inherit; }
  button:hover { background: #f2f4f9; }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-size: 12px; color: #7b8194; padding: 0 0 6px; }
  .row { display: grid; grid-template-columns: 1fr; gap: 2px; margin-bottom: 10px; }
  .row b { font-weight: 500; font-size: 12px; color: #4a5163; }
  input[type=range] { width: 100%; }
  label.tog { display: block; margin: 4px 0; cursor: pointer; font-size: 13px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
        margin-right: 6px; vertical-align: -1px; }
  .note { color: #7b8194; font-size: 12px; line-height: 1.7; margin: 0; }
  details { font-size: 12px; color: #7b8194; }
  details summary { cursor: pointer; padding: 2px 0; }
  details .grp { margin: 6px 0 2px; color: #4a5163; }
  details code { font: 11px/1.7 ui-monospace, Menlo, monospace; color: #5b6172;
                 word-break: break-all; }
  .note b { font-weight: 600; color: #4a5163; }
  .note code { font: 11px ui-monospace, Menlo, monospace; color: #4a5163; }
  #err { color: #b3261e; font: 12px/1.5 ui-monospace, monospace;
         white-space: pre-wrap; display: none; }
  /* 링크로 받은 정의는 남이 쓴 코드다. 실행 전에 눈에 띄어야 한다 (§19.4) */
  #shared { display: none; border: 1px solid #e8c46a; background: #fdf7e6;
            border-radius: 6px; padding: 10px 12px; font-size: 12px;
            line-height: 1.6; color: #5c4a12; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .bar .msg { font-size: 12px; color: #7b8194; }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="stat"></div>
  <div id="boot">시작하는 중…</div>
</div>

<aside>
  <h1>Cut Pattern Explorer</h1>
  <div id="shared"></div>
  <textarea id="src" spellcheck="false"></textarea>
  <div class="bar">
    <button id="run">실행</button>
    <button id="stop" disabled>중지</button>
    <button id="share">공유 링크 복사</button>
    <span class="msg" id="msg"></span>
  </div>
  <div id="err"></div>
  <fieldset id="sliders"><legend>절단 각도</legend></fieldset>
  <fieldset id="sets"><legend>축 집합</legend></fieldset>
  <fieldset>
    <label class="tog"><input type="checkbox" id="mk" checked> 축 마커</label>
    <label class="tog"><input type="checkbox" id="lb" checked> 축 라벨</label>
  </fieldset>
  <details id="vocab">
    <summary>바로 쓸 수 있는 이름</summary>
    <div id="vocabList"></div>
  </details>
  <p class="note">
    정의는 <b>스크립트</b>다. 함수로 감싸거나 <code>return</code> 할 것 없이
    <code>with puzzle(...) as p:</code> 블록만 있으면 찾아서 쓴다.
    축 집합마다 절단 각도 슬라이더가 하나씩 붙는다.
  </p>
  <p class="note">
    편집창에서 <b>Tab</b> 은 4칸 들여쓰기, <b>Shift+Tab</b> 은 내어쓰기다.
    콜론으로 끝난 줄에서 Enter 를 치면 한 단 더 들어간다.
    <b>Esc</b> 를 누른 뒤 Tab 은 원래대로 포커스를 옮긴다.
    <b>Ctrl+Enter</b> 로 실행한다.
  </p>
</aside>

<script src="vocab.js"></script>
<script src="render.js"></script>
<script src="editor.js"></script>
<script src="share.js"></script>
<script src="app.js"></script>
<script>
"use strict";

const DEFAULT_SOURCE = `faces = cube("faces", turns=(45, -45, 90, -90, 180))

with puzzle("OctoCube Master", faces) as p:
    split(faces)
    for x in faces:
        with turned(x, 45):
            split(*at_angle(x, 90, faces))
`;

// 조작 중 / 멎은 뒤 tessellation (§12.3). 조작 중에는 거칠게 그린다
const DRAG_STEP = 0.12;
const FINAL_STEP = 0.03;
const SETTLE_MS = 220;

const view = new SphereView(document.getElementById("c"));
// textarea 는 Tab 이 포커스 이동이다. 파이썬은 들여쓰기가 문법이라 그대로는
// 정의를 쓸 수 없다 (§19.6)
Editor.attach(document.getElementById("src"));
const els = {
  src: document.getElementById("src"), run: document.getElementById("run"),
  err: document.getElementById("err"), sliders: document.getElementById("sliders"),
  sets: document.getElementById("sets"), stat: document.getElementById("stat"),
  boot: document.getElementById("boot"), shared: document.getElementById("shared"),
  share: document.getElementById("share"), msg: document.getElementById("msg"),
  stop: document.getElementById("stop"),
};

const engine = new Engine((msg) => { els.boot.textContent = msg; els.boot.style.display = msg ? "grid" : "none"; });
let angles = {};
let info = null;
let settleTimer = null;

function fail(e) {
  els.err.style.display = "block";
  els.err.textContent = String(e && e.message ? e.message : e);
}

function clearError() { els.err.style.display = "none"; els.err.textContent = ""; }

// 평가가 worker 에서 도므로 여기서 기다려도 UI 가 안 멈춘다. 다만 슬라이더가
// 평가보다 빨리 움직이므로, 도는 중이면 마지막 요청만 남겨 두고 합친다
let inFlight = false;
let queued = null;

async function refresh(maxStep) {
  if (inFlight) { queued = maxStep; return; }
  inFlight = true;
  els.stop.disabled = false;
  try {
    const t0 = performance.now();
    const out = await engine.evaluate(angles, maxStep);
    const ms = performance.now() - t0;
    view.setScene(out.scene);
    const hidden = [...view.hidden].map((i) => out.scene.axisSets[i]);
    els.stat.textContent =
      `carrier ${out.carriers}  폴리라인 ${out.scene.starts.length}  ` +
      `총 호 길이 ${out.length.toFixed(3)}  평가 ${ms.toFixed(0)}ms` +
      (out.note ? `  |  ${out.note}` : "") +
      (hidden.length ? `  |  숨긴 축 집합: ${hidden.join(", ")} (재료는 그대로 있다)` : "");
    clearError();
  } catch (e) {
    fail(e);
  } finally {
    inFlight = false;
    els.stop.disabled = true;
    if (queued !== null) { const next = queued; queued = null; refresh(next); }
  }
}

function scheduleFinal() {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => refresh(FINAL_STEP), SETTLE_MS);
}

function buildSliders() {
  els.sliders.replaceChildren(Object.assign(document.createElement("legend"), { textContent: "절단 각도" }));
  for (const id of info.inputs) {
    if (angles[id] === undefined) angles[id] = 60;
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("b");
    const range = document.createElement("input");
    range.type = "range"; range.min = 0.01; range.max = 179.99; range.step = 0.05;
    range.value = angles[id];
    const show = () => { name.textContent = `${id}   ${Number(range.value).toFixed(2)}°`; };
    range.oninput = () => {
      angles[id] = Number(range.value);
      show(); refresh(DRAG_STEP); scheduleFinal();
    };
    show();
    row.append(name, range);
    els.sliders.append(row);
  }
}

function buildToggles() {
  els.sets.replaceChildren(Object.assign(document.createElement("legend"), { textContent: "축 집합" }));
  view.hidden.clear();
  info.axisSets.forEach((id, i) => {
    const label = document.createElement("label");
    label.className = "tog";
    const box = document.createElement("input");
    box.type = "checkbox"; box.checked = true;
    box.onchange = () => {
      box.checked ? view.hidden.delete(i) : view.hidden.add(i);
      view.draw(); refresh(FINAL_STEP);
    };
    const sw = document.createElement("span");
    sw.className = "sw";
    sw.style.background = `rgb(${PALETTE[i % PALETTE.length]})`;
    label.append(box, sw, document.createTextNode(id));
    els.sets.append(label);
  });
}

async function run() {
  try {
    els.stop.disabled = false;
    info = await engine.prepare(els.src.value);
    clearError();
    els.shared.style.display = "none";
    buildSliders();
    buildToggles();
    await refresh(FINAL_STEP);
  } catch (e) { fail(e); }
  finally { els.stop.disabled = !engine.running; }
}

// 무한 루프에 빠진 정의를 죽인다. worker 가 아니면 할 수 없는 일이다 (§19.5)
els.stop.onclick = async () => {
  engine.stop();
  els.stop.disabled = true;
  queued = null; inFlight = false;
  fail("정의를 중지했다. 엔진을 다시 올린다.");
  await engine.boot();
  clearError();
  els.msg.textContent = "엔진을 다시 올렸다";
  setTimeout(() => { els.msg.textContent = ""; }, 4000);
};

// ---- 공유 링크 (§19.4) ------------------------------------------------

els.share.onclick = async () => {
  const link = await Share.shareLink(els.src.value, location.href);
  try {
    await navigator.clipboard.writeText(link);
    els.msg.textContent = `복사했다 (${link.length}자)`;
  } catch (_) {
    // 클립보드가 막힌 환경이면 주소창에라도 남긴다
    location.hash = link.split("#")[1];
    els.msg.textContent = "주소창에 넣었다. 복사해서 쓴다";
  }
  if (link.length > Share.SAFE_URL_LENGTH) {
    els.msg.textContent += " — 너무 길어 잘릴 수 있다";
  }
  setTimeout(() => { els.msg.textContent = ""; }, 4000);
};

els.run.onclick = run;
els.src.onkeydown = (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
};
document.getElementById("mk").onchange = (e) => { view.showMarkers = e.target.checked; view.draw(); };
document.getElementById("lb").onchange = (e) => { view.showLabels = e.target.checked; view.draw(); };
// window resize 는 창 크기만 본다. 패널이나 폰트 변화로 캔버스만 바뀌는 경우를
// 놓치므로 요소를 직접 관찰한다
new ResizeObserver(() => view.draw()).observe(document.getElementById("stage"));

// 링크로 받은 정의는 **실행하지 않는다.** 편집창에 채워만 넣고 사람이 읽고
// 누른다. 링크를 여는 것이 곧 임의 코드 실행이 되면 안 된다 (§19.4)
// 이름이 마법처럼 존재하면 무엇을 쓸 수 있는지 알 길이 없다. 암묵 import 의
// 값이자 대가다 (§19.7).
//
// vocab.js 는 번들을 만들 때 같은 __all__ 에서 뽑아 둔 정적 데이터다. worker 를
// 거쳐 가져오면 비동기, 메시지 왕복, Pyodide 의 타입 변환이 끼어드는데 그중
// 하나만 어긋나도 목록이 조용히 빈다. Pyodide 를 기다릴 이유도 없다
function showVocabulary() {
  const box = document.getElementById("vocabList");
  box.replaceChildren();
  const groups = globalThis.VOCAB;
  if (!groups) {
    box.textContent = "vocab.js 가 없다. python web/bundle_engine.py 를 돌린다.";
    return;
  }
  for (const [group, items] of Object.entries(groups)) {
    const head = document.createElement("div");
    head.className = "grp";
    head.textContent = `${group} (${items.length})`;
    const body = document.createElement("code");
    body.textContent = items.join(", ");
    box.append(head, body);
  }
}
showVocabulary();   // Pyodide 와 무관하다. 바로 보인다

async function start() {
  let shared = null;
  try {
    shared = await Share.sourceFromHash(location.hash);
  } catch (e) {
    fail("링크의 정의를 읽지 못했다: " + e.message);
  }

  await engine.boot();

  if (shared === null) {
    els.src.value = DEFAULT_SOURCE;
    run();                      // 우리가 쓴 기본 정의다
    return;
  }
  els.src.value = shared;
  els.shared.style.display = "block";
  els.shared.textContent =
    "링크에서 정의를 불러왔다. 남이 쓴 파이썬 코드이고, 실행하면 이 브라우저에서 " +
    "돈다. 내용을 읽어 보고 실행을 누른다.";
}

start().catch((e) => { els.boot.style.display = "none"; fail(e); });
</script>
