<!doctype html>
<meta charset="utf-8">
<title>Cut Pattern Explorer</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px ui-sans-serif, system-ui, sans-serif;
    background: #fbfbfd; color: #1b1e26;
    display: grid; grid-template-columns: 1fr 340px; height: 100vh;
  }
  /* grid 항목은 min-width/min-height 가 auto 라 내용보다 작아지지 않는다.
     캔버스 내부 해상도(= dpr 배)가 min-content 로 잡히면 열이 넓어지고,
     넓어진 폭으로 다시 내부 해상도를 키우는 되먹임이 생긴다. 고리를 끊는다 */
  #stage, aside { min-width: 0; min-height: 0; }
  #stage { position: relative; overflow: hidden; }
  /* absolute 로 띄워 레이아웃 계산에서 아예 빠지게 한다 */
  canvas { position: absolute; inset: 0; width: 100%; height: 100%;
           display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #stat { position: absolute; left: 16px; bottom: 12px; right: 16px;
          color: #7b8194; font-size: 12px; line-height: 1.5; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center;
          color: #7b8194; background: #fbfbfd; }
  aside { border-left: 1px solid #e3e6ee; padding: 16px; overflow-y: auto;
          display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 13px; margin: 0; letter-spacing: .02em; color: #5b6172; }
  textarea { width: 100%; height: 220px; padding: 10px; resize: vertical;
             font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
             border: 1px solid #dfe3ec; border-radius: 6px; background: #fff;
             tab-size: 4; }
  button { padding: 7px 14px; border: 1px solid #c9cfdd; border-radius: 6px;
           background: #fff; cursor: pointer; font: inherit; }
  button:hover { background: #f2f4f9; }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-size: 12px; color: #7b8194; padding: 0 0 6px; }
  .row { display: grid; grid-template-columns: 1fr; gap: 2px; margin-bottom: 10px; }
  .row b { font-weight: 500; font-size: 12px; color: #4a5163;
           display: flex; justify-content: space-between; align-items: center; }
  /* 축 집합 한 줄: 색 / 이름 / 편집 메뉴 / 지우기 (§19.12) */
  .setrow { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .setrow .nm { flex: 1; min-width: 0; font-size: 13px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .setrow select { font-size: 11px; padding: 2px; max-width: 130px; }
  .del { border: 0; background: none; cursor: pointer; padding: 0 2px;
         color: #b0b6c6; font-size: 15px; line-height: 1; }
  .del:hover { color: #b3261e; }
  /* 숫자를 눌러 정확한 값을 넣는다. 슬라이더 스텝(0.05)으로는 63.4349 같은
     값에 닿을 수 없다 (§19.8) */
  .val { cursor: text; border-bottom: 1px dotted #c2c8d6; padding: 0 1px; }
  .val:hover { background: #eef1f7; }
  .row input.num { width: 84px; font: inherit; padding: 0 2px;
                   border: 1px solid #7aa7e8; border-radius: 3px; }
  input[type=range] { width: 100%; }
  label.tog { display: block; margin: 4px 0; cursor: pointer; font-size: 13px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
        margin-right: 6px; vertical-align: -1px; flex: none; }
  /* puzzle() 인자가 아니면 그려지지 않는다. 기준으로만 쓰는 집합이다 */
  .sw.off { background: none; border: 1px dashed #c2c8d6; }
  details { font-size: 12px; color: #7b8194; }
  details summary { cursor: pointer; padding: 2px 0; }
  details .grp { margin: 6px 0 2px; color: #4a5163; }
  details code { font: 11px/1.7 ui-monospace, Menlo, monospace; color: #5b6172;
                 word-break: break-all; }
  #err { color: #b3261e; font: 12px/1.5 ui-monospace, monospace;
         white-space: pre-wrap; display: none; }
  /* 링크로 받은 정의는 남이 쓴 코드다. 실행 전에 눈에 띄어야 한다 (§19.4) */
  #shared { display: none; border: 1px solid #e8c46a; background: #fdf7e6;
            border-radius: 6px; padding: 10px 12px; font-size: 12px;
            line-height: 1.6; color: #5c4a12; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .bar select { flex: 1; min-width: 0; padding: 5px; }
  .bar .msg { font-size: 12px; color: #7b8194; }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="stat"></div>
  <div id="boot">Starting…</div>
</div>

<aside>
  <h1>Cut Pattern Explorer</h1>
  <div id="shared"></div>
  <div class="bar">
    <select id="addPick"></select>
    <button id="add">Add axis set</button>
  </div>
  <textarea id="src" spellcheck="false"></textarea>
  <div class="bar">
    <button id="run">Run</button>
    <button id="stop" disabled>Stop</button>
    <button id="share">Copy share link</button>
    <span class="msg" id="msg"></span>
  </div>
  <div id="err"></div>
  <fieldset id="sliders"><legend>Cut angle</legend></fieldset>
  <fieldset id="sets"><legend>Axis sets</legend></fieldset>
  <fieldset>
    <label class="tog"><input type="checkbox" id="mk" checked> Axis markers</label>
    <label class="tog"><input type="checkbox" id="lb" checked> Axis labels</label>
  </fieldset>
  <details id="vocab">
    <summary>Names in scope</summary>
    <div id="vocabList"></div>
  </details>
</aside>

<script src="vocab.js?v=bf4762f1"></script>
<script src="render.js?v=bf4762f1"></script>
<script src="editor.js?v=bf4762f1"></script>
<script src="share.js?v=bf4762f1"></script>
<script src="app.js?v=bf4762f1"></script>
<script>
"use strict";

const DEFAULT_SOURCE = `cube1 = cube("cube1", turns=(45, -45, 90, -90, 180))

with puzzle("OctoCube Master", cube1) as p:
    split(cube1)
    for x in cube1:
        with turned(x, 45):
            split(*at_angle(x, 90, cube1))
`;

// 조작 중 / 멎은 뒤 tessellation (§12.3). 조작 중에는 거칠게 그린다
const DRAG_STEP = 0.12;
const FINAL_STEP = 0.03;
const SETTLE_MS = 220;

const view = new SphereView(document.getElementById("c"));
// textarea 는 Tab 이 포커스 이동이다. 파이썬은 들여쓰기가 문법이라 그대로는
// 정의를 쓸 수 없다 (§19.6)
Editor.attach(document.getElementById("src"));
const els = {
  src: document.getElementById("src"), run: document.getElementById("run"),
  err: document.getElementById("err"), sliders: document.getElementById("sliders"),
  sets: document.getElementById("sets"), stat: document.getElementById("stat"),
  boot: document.getElementById("boot"), shared: document.getElementById("shared"),
  share: document.getElementById("share"), msg: document.getElementById("msg"),
  stop: document.getElementById("stop"),
  add: document.getElementById("add"), addPick: document.getElementById("addPick"),
};

// "축 집합 추가" 메뉴. 고르면 **코드를 쓴다** — 숨은 상태를 들고 있으면 메뉴로
// 시작해 손으로 이어 쓰는 길이 막히고, DSL 이 파이썬인 이유가 사라진다 (§19.9)
for (const [group, items] of Object.entries(globalThis.MENU || {})) {
  const optgroup = document.createElement("optgroup");
  optgroup.label = group;
  for (const [key, label] of items) optgroup.append(new Option(label, key));
  els.addPick.append(optgroup);
}

// 축 집합을 고치는 연산 (§19.12). 말줄임표는 "호출을 써 줄 테니 인자를 고쳐라"
const AXIS_OPS = [
  ["rotate", "Rotate…"],
  ["remove", "Remove an axis…"],
  ["rename", "Rename an axis…"],
  ["mirror", "Mirror"],
  ["invert", "Invert"],
];

const engine = new Engine((msg) => { els.boot.textContent = msg; els.boot.style.display = msg ? "grid" : "none"; });
let angles = {};
let info = null;
let settleTimer = null;

function fail(e) {
  els.err.style.display = "block";
  els.err.textContent = String(e && e.message ? e.message : e);
}

function clearError() { els.err.style.display = "none"; els.err.textContent = ""; }

// 메뉴가 고친 코드를 편집창에 되쓴다 (§19.9). `.value =` 로 통째 대입하면
// 되돌리기 기록이 날아간다 — 잘못 지웠을 때 되돌릴 길이 없어진다.
// setRangeText 는 기록에 남는다 (editor.js 가 쓰는 것과 같은 기계)
function rewrite(text) {
  els.src.focus();
  els.src.setRangeText(text, 0, els.src.value.length, "end");
}

// 평가가 worker 에서 도므로 여기서 기다려도 UI 가 안 멈춘다. 다만 슬라이더가
// 평가보다 빨리 움직이므로, 도는 중이면 마지막 요청만 남겨 두고 합친다
let inFlight = false;
let queued = null;

async function refresh(maxStep) {
  if (inFlight) { queued = maxStep; return; }
  inFlight = true;
  els.stop.disabled = false;
  try {
    const t0 = performance.now();
    const out = await engine.evaluate(angles, maxStep);
    const ms = performance.now() - t0;
    view.setScene(out.scene);
    const hidden = [...view.hidden].map((i) => out.scene.axisSets[i]);
    els.stat.textContent =
      `carriers ${out.carriers}  polylines ${out.scene.starts.length}  ` +
      `arc length ${out.length.toFixed(3)}  eval ${ms.toFixed(0)}ms` +
      // 0 과 180 은 퇴화원이라 자를 것이 없다. 남는 폴리라인은 축 마커뿐인데
      // 그것만 보이면 고장난 것처럼 읽힌다 (§14)
      (out.carriers === 0 ? "  |  no cuts (0° and 180° have zero radius)" : "") +
      (out.note ? `  |  ${out.note}` : "") +
      (hidden.length ? `  |  hidden: ${hidden.join(", ")} (the material is still there)` : "");
    clearError();
  } catch (e) {
    fail(e);
  } finally {
    inFlight = false;
    els.stop.disabled = true;
    if (queued !== null) { const next = queued; queued = null; refresh(next); }
  }
}

function scheduleFinal() {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => refresh(FINAL_STEP), SETTLE_MS);
}

function buildSliders() {
  els.sliders.replaceChildren(Object.assign(document.createElement("legend"), { textContent: "Cut angle" }));
  for (const id of info.inputs) {
    if (angles[id] === undefined) angles[id] = 60;
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("b");
    const label = document.createTextNode(id + "   ");
    const val = document.createElement("span");
    val.className = "val";
    val.title = "Click to type an exact value";
    name.append(label, val);

    const range = document.createElement("input");
    // 0 과 180 은 퇴화원이다 (r = 0). 터지지 않고 "자를 게 없는 상태" 로
    // 나온다 — RADIUS_EPS 판정이 split 과 build_arcs 에서 걸러 낸다 (§14)
    range.type = "range"; range.min = 0; range.max = 180; range.step = 0.05;
    range.value = angles[id];

    const show = () => { val.textContent = Number(angles[id]).toFixed(4) + "°"; };

    const setAngle = (value, coarse) => {
      const next = Math.min(180, Math.max(0, Number(value)));
      if (!Number.isFinite(next)) return;
      angles[id] = next;
      range.value = next;
      show();
      refresh(coarse ? DRAG_STEP : FINAL_STEP);
      if (coarse) scheduleFinal();
    };

    range.oninput = () => setAngle(range.value, true);

    // 숫자를 눌러 그 자리에서 고친다. 슬라이더는 스텝이 0.05 라 정다면체의
    // 특징적인 각(63.4349 등)에 닿을 수 없다 (§19.8)
    val.onclick = () => {
      const box = document.createElement("input");
      box.type = "number"; box.className = "num";
      box.min = 0; box.max = 180; box.step = "any";
      box.value = Number(angles[id]).toFixed(4);
      let done = false;
      const finish = (commit) => {
        if (done) return;
        done = true;
        box.replaceWith(val);
        if (commit) setAngle(box.value, false);
      };
      box.onkeydown = (ev) => {
        if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
        else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
      };
      box.onblur = () => finish(true);
      val.replaceWith(box);
      box.focus();
      box.select();
    };

    show();
    row.append(name, range);
    els.sliders.append(row);
  }
}

function buildToggles() {
  els.sets.replaceChildren(Object.assign(document.createElement("legend"), { textContent: "Axis sets" }));
  view.hidden.clear();
  // 그려지는 것만이 축 집합의 전부가 아니다. 기준으로만 쓰는 집합도 고치고
  // 지울 수 있어야 한다 (§19.12)
  const sets = (info.sets && info.sets.length)
    ? info.sets : info.axisSets.map((id) => ({ id, axes: [] }));

  sets.forEach((set, n) => {
    const drawn = info.axisSets.indexOf(set.id);
    const row = document.createElement("div");
    row.className = "setrow";

    const sw = document.createElement("span");
    sw.className = "sw";
    if (drawn >= 0) {
      const box = document.createElement("input");
      box.type = "checkbox"; box.checked = true;
      box.title = "Hide this axis set (the material is still there)";
      box.onchange = () => {
        box.checked ? view.hidden.delete(drawn) : view.hidden.add(drawn);
        view.draw(); refresh(FINAL_STEP);
      };
      sw.style.background = `rgb(${PALETTE[drawn % PALETTE.length]})`;
      row.append(box, sw);
    } else {
      sw.className = "sw off";
      sw.title = "Not passed to puzzle(...), so it is not drawn";
      row.append(sw);
    }

    const name = document.createElement("span");
    name.className = "nm";
    name.textContent = set.id;
    name.title = set.axes.length ? set.axes.length + " axes: " + set.axes.join(", ") : set.id;
    row.append(name);

    // 메뉴가 **호출을 써 준다.** 이 이름들은 진작 있었는데 아무도 몰랐다.
    // 부르는 대신 써 주면 다음부터는 손으로 쓸 수 있다 (§19.12)
    const pick = document.createElement("select");
    pick.append(new Option("Edit…", ""));
    for (const [op, label] of AXIS_OPS) pick.append(new Option(label, op));
    // merge 는 축 id 를 그대로 물려받는다. 상대가 그려지는 집합이면 같은 id 가
    // 두 곳에 생긴다. 앞에 정의된 것만 쓸 수 있다 — 파이썬은 위에서 아래다
    for (const other of sets.slice(0, n)) {
      if (info.axisSets.includes(other.id)) continue;
      pick.append(new Option("Merge with " + other.id, "merge:" + other.id));
    }
    pick.onchange = async () => {
      const raw = pick.value;
      pick.value = "";
      if (!raw) return;
      const at = raw.indexOf(":");
      const op = at < 0 ? raw : raw.slice(0, at);
      const other = at < 0 ? null : raw.slice(at + 1);
      if (!engine.ready) { fail("The engine is not running. Reload the page."); return; }
      try {
        rewrite(await engine.axisOp(els.src.value, set.id, op, other));
        clearError();
        await run();
      } catch (e) { fail(e); }
    };
    row.append(pick);

    // 지우기는 딸린 코드까지 데려간다 (§19.9). 되돌리기가 살아 있다
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.title = "Remove this axis set and everything that uses it";
    del.onclick = async () => {
      if (!engine.ready) { fail("The engine is not running. Reload the page."); return; }
      try {
        rewrite(await engine.removeAxisSet(els.src.value, set.id));
        clearError();
        await run();
      } catch (e) { fail(e); }
    };
    row.append(del);

    els.sets.append(row);
  });
}

async function run() {
  if (!engine.ready) {
    fail("The engine is not running. Reload the page.");
    return;
  }
  try {
    els.stop.disabled = false;
    info = await engine.prepare(els.src.value);
    clearError();
    els.shared.style.display = "none";
    buildSliders();
    buildToggles();
    await refresh(FINAL_STEP);
  } catch (e) { fail(e); }
  finally { els.stop.disabled = !engine.running; }
}

// 무한 루프에 빠진 정의를 죽인다. worker 가 아니면 할 수 없는 일이다 (§19.5)
els.stop.onclick = async () => {
  engine.stop();
  els.stop.disabled = true;
  queued = null; inFlight = false;
  fail("Stopped. Restarting the engine…");
  try {
    await engine.boot();
  } catch (e) {
    // 재부팅이 실패하면 "중지했다" 가 그대로 남아 원인을 가린다
    fail("Could not restart the engine: " + e.message);
    return;
  }
  clearError();
  els.msg.textContent = "Engine restarted";
  setTimeout(() => { els.msg.textContent = ""; }, 4000);
};

// ---- 공유 링크 (§19.4) ------------------------------------------------

els.share.onclick = async () => {
  const link = await Share.shareLink(els.src.value, location.href);
  try {
    await navigator.clipboard.writeText(link);
    els.msg.textContent = `Copied (${link.length} chars)`;
  } catch (_) {
    // 클립보드가 막힌 환경이면 주소창에라도 남긴다
    location.hash = link.split("#")[1];
    els.msg.textContent = "Put it in the address bar — copy from there";
  }
  if (link.length > Share.SAFE_URL_LENGTH) {
    els.msg.textContent += " — long enough that it may get truncated";
  }
  setTimeout(() => { els.msg.textContent = ""; }, 4000);
};

els.add.onclick = async () => {
  if (!engine.ready) { fail("The engine is not running. Reload the page."); return; }
  try {
    rewrite(await engine.addAxisSet(els.src.value, els.addPick.value));
    clearError();
    await run();
  } catch (e) { fail(e); }
};

els.run.onclick = run;
els.src.onkeydown = (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
};
document.getElementById("mk").onchange = (e) => { view.showMarkers = e.target.checked; view.draw(); };
document.getElementById("lb").onchange = (e) => { view.showLabels = e.target.checked; view.draw(); };
// window resize 는 창 크기만 본다. 패널이나 폰트 변화로 캔버스만 바뀌는 경우를
// 놓치므로 요소를 직접 관찰한다
new ResizeObserver(() => view.draw()).observe(document.getElementById("stage"));

// 링크로 받은 정의는 **실행하지 않는다.** 편집창에 채워만 넣고 사람이 읽고
// 누른다. 링크를 여는 것이 곧 임의 코드 실행이 되면 안 된다 (§19.4)
// 이름이 마법처럼 존재하면 무엇을 쓸 수 있는지 알 길이 없다. 암묵 import 의
// 값이자 대가다 (§19.7).
//
// vocab.js 는 번들을 만들 때 같은 __all__ 에서 뽑아 둔 정적 데이터다. worker 를
// 거쳐 가져오면 비동기, 메시지 왕복, Pyodide 의 타입 변환이 끼어드는데 그중
// 하나만 어긋나도 목록이 조용히 빈다. Pyodide 를 기다릴 이유도 없다
function showVocabulary() {
  const box = document.getElementById("vocabList");
  box.replaceChildren();
  const groups = globalThis.VOCAB;
  if (!groups) {
    box.textContent = "vocab.js is missing. Run: python web/bundle_engine.py";
    return;
  }
  for (const [group, items] of Object.entries(groups)) {
    const head = document.createElement("div");
    head.className = "grp";
    head.textContent = `${group} (${items.length})`;
    const body = document.createElement("code");
    body.textContent = items.join(", ");
    box.append(head, body);
  }
}
showVocabulary();   // Pyodide 와 무관하다. 바로 보인다

async function start() {
  let shared = null;
  try {
    shared = await Share.sourceFromHash(location.hash);
  } catch (e) {
    fail("Could not read the definition from the link: " + e.message);
  }

  // 편집창부터 채운다. 부팅이 실패해도 코드는 보여야 하고, 링크로 받은 정의가
  // 사라지면 안 된다
  if (shared === null) {
    els.src.value = DEFAULT_SOURCE;
  } else {
    els.src.value = shared;
    els.shared.style.display = "block";
    els.shared.textContent =
      "Loaded a definition from the link. This is Python written by someone " +
      "else and it runs in your browser. Read it, then press Run.";
  }

  await engine.boot();

  // 받은 정의는 자동 실행하지 않는다 (§19.4). 우리가 쓴 기본 정의만 돌린다
  if (shared === null) run();
}

start().catch((e) => { els.boot.style.display = "none"; fail(e); });
</script>
