<!doctype html>
<meta charset="utf-8">
<!-- 정의가 밖으로 나가는 길을 막는다 (§19.14).

     GitHub Pages 는 응답 헤더를 줄 수 없으므로 meta 로 건다. worker 는 문서의
     CSP 를 물려받지 않지만, blob 으로 띄운 worker 는 물려받는다 — 그래서
     connect-src 가 정의가 실제로 도는 곳까지 간다 (web/app.js).

     'unsafe-eval' 은 Pyodide 가 필요로 한다. Emscripten 의 EM_JS 상수가
     초기화 때 eval() 로 만들어진다. 이것이 우리가 사는 성질을 깎지는 않는다 —
     필요한 것은 출처 목록이고, eval 은 같은 전역 안에서 문자열을 코드로 만드는
     것뿐이라 밖으로 나가지 못한다. 지울 수 없는 동적 import() 는 script-src
     'self' 에 걸린다.

     'unsafe-inline' 도 마찬가지다. index.html 의 인라인 script/style 을 위한
     것이고, 출처 목록은 그대로 산다.

     worker-src 에 'self' 가 필요한 것은 blob 이 import 하는 worker.js 때문이다.
     Chrome 은 모듈 worker 의 **모듈 그래프 전체**를 "worker 만들기" 로 봐서
     script-src 가 아니라 worker-src 로 잰다. blob: 만 열면 shim 은 뜨는데
     본문이 막힌다.

     worker-src 를 모르는 브라우저는 child-src 로, 그것도 모르면 default-src
     로 떨어진다. script-src 에 blob: 을 넣지 않는 것은 일부러다 — 넣으면
     정의가 제 blob 을 만들어 import 할 수 있다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src blob: 'self'; child-src blob: 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>Cut Pattern Explorer</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px ui-sans-serif, system-ui, sans-serif;
    background: #fbfbfd; color: #1b1e26;
    /* 편집창이 코드를 담는 자리다. 폭이 좁으면 파이썬 한 줄이 화면을
       넘어가고, 넘어가면 가로로 밀어야 한다 (§19.6). 그래픽을 줄이더라도
       이쪽을 넓게 잡는다 */
    display: grid; grid-template-columns: 1fr clamp(360px, 32vw, 560px);
    height: 100vh;
  }
  /* grid 항목은 min-width/min-height 가 auto 라 내용보다 작아지지 않는다.
     캔버스 내부 해상도(= dpr 배)가 min-content 로 잡히면 열이 넓어지고,
     넓어진 폭으로 다시 내부 해상도를 키우는 되먹임이 생긴다. 고리를 끊는다 */
  #stage, aside { min-width: 0; min-height: 0; }
  #stage { position: relative; overflow: hidden; }
  /* absolute 로 띄워 레이아웃 계산에서 아예 빠지게 한다 */
  canvas { position: absolute; inset: 0; width: 100%; height: 100%;
           display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #stat { position: absolute; left: 16px; bottom: 12px; right: 16px;
          color: #7b8194; font-size: 12px; line-height: 1.5; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center;
          color: #7b8194; background: #fbfbfd; }
  aside { border-left: 1px solid #e3e6ee; padding: 16px; overflow-y: auto;
          display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 13px; margin: 0; letter-spacing: .02em; color: #5b6172; }
  /* 긴 줄은 접지 않고 가로로 민다 (§19.6). 접으면 한 줄이 두 줄로 보여
     들여쓰기 열이 어긋나 보이는데, 파이썬은 그 열이 문법이다 */
  textarea { width: 100%; height: clamp(240px, 44vh, 620px); padding: 10px; resize: vertical;
             overflow-x: auto;
             font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
             border: 1px solid #dfe3ec; border-radius: 6px; background: #fff;
             tab-size: 4; }
  button { padding: 7px 14px; border: 1px solid #c9cfdd; border-radius: 6px;
           background: #fff; cursor: pointer; font: inherit; }
  button:hover { background: #f2f4f9; }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-size: 12px; color: #7b8194; padding: 0 0 6px; }
  .row { display: grid; grid-template-columns: 1fr; gap: 2px; margin-bottom: 10px; }
  .row b { font-weight: 500; font-size: 12px; color: #4a5163;
           display: flex; justify-content: space-between; align-items: center; }
  /* 축 집합 한 줄: 색 / 이름 / 편집 메뉴 / 지우기 (§19.12) */
  .setrow { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .setrow .nm { flex: 1; min-width: 0; font-size: 13px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .setrow select { font-size: 11px; padding: 2px; max-width: 130px; }
  .del { border: 0; background: none; cursor: pointer; padding: 0 2px;
         color: #b0b6c6; font-size: 15px; line-height: 1; }
  .del:hover { color: #b3261e; }
  /* 숫자를 눌러 정확한 값을 넣는다. 슬라이더 스텝(0.05)으로는 63.4349 같은
     값에 닿을 수 없다 (§19.8) */
  .val { cursor: text; border-bottom: 1px dotted #c2c8d6; padding: 0 1px; }
  .val:hover { background: #eef1f7; }
  .row input.num { width: 84px; font: inherit; padding: 0 2px;
                   border: 1px solid #7aa7e8; border-radius: 3px; }
  input[type=range] { width: 100%; }
  label.tog { display: block; margin: 4px 0; cursor: pointer; font-size: 13px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
        margin-right: 6px; vertical-align: -1px; flex: none; }
  /* puzzle() 인자가 아니면 그려지지 않는다. 기준으로만 쓰는 집합이다 */
  .sw.off { background: none; border: 1px dashed #c2c8d6; }
  details { font-size: 12px; color: #7b8194; }
  /* 목록이 열리면 아래로 길어진다. 링크는 첫 줄에 붙어 있어야 한다 */
  .vocabrow { align-items: flex-start; justify-content: space-between; }
  .vocabrow details { flex: 1; }
  #docs { font-size: 12px; color: #7b8194; text-decoration: none;
          white-space: nowrap; padding: 2px 0; }
  #docs:hover { color: #4a5163; text-decoration: underline; }
  details summary { cursor: pointer; padding: 2px 0; }
  details .grp { margin: 6px 0 2px; color: #4a5163; }
  details code { font: 11px/1.7 ui-monospace, Menlo, monospace; color: #5b6172;
                 word-break: break-all; }
  #err { color: #b3261e; font: 12px/1.5 ui-monospace, monospace;
         white-space: pre-wrap; display: none; }
  /* 링크로 받은 정의는 남이 쓴 코드다. 실행 전에 눈에 띄어야 한다 (§19.4) */
  #shared { display: none; border: 1px solid #e8c46a; background: #fdf7e6;
            border-radius: 6px; padding: 10px 12px; font-size: 12px;
            line-height: 1.6; color: #5c4a12; }
  .bar { display: flex; gap: 8px; align-items: center; }
  /* UA 의 [hidden]{display:none} 은 **작성자 규칙에 진다.** .bar 가 flex 라
     hidden 을 걸어도 그대로 보인다. 모드 전환이 조용히 안 먹는 자리다 */
  [hidden] { display: none !important; }
  /* 나타났다 사라지는 것이 본질인 버튼은 **자리를 비워 둔다** (§19.15).
     display 로 지우면 옆의 것들이 밀렸다 당겨졌다 한다 */
  .away { visibility: hidden; }
  .bar select { flex: 1; min-width: 0; padding: 5px; }
  .bar .msg { font-size: 12px; color: #7b8194; }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="stat"></div>
  <div id="boot">Starting…</div>
</div>

<aside>
  <h1>Cut Pattern Explorer</h1>
  <!-- 편집 모드에서는 편집밖에 못 한다 (§19.15). class="editonly" 가 붙은
       것만 그때 보인다. 오류와 축 집합 목록은 두 모드에 다 있다 -->
  <div class="bar">
    <button id="mode">Edit definition</button>
    <!-- 공유는 **보내는 쪽** 일이라 두 모드에 다 있다. §19.4 의 성질은 받는
         사람이 코드를 읽는 것이지, 보내는 사람이 편집창을 거치는 게 아니다 -->
    <button id="share">Copy share link</button>
    <!-- 평소엔 숨어 있다가 평가가 오래 끌면 나타난다 (§19.15). 늘 있으면
         화면만 먹고, 없으면 멎었을 때 탈출구가 없다 -->
    <button id="stop" hidden>Stop</button>
    <span class="msg" id="msg"></span>
  </div>
  <div id="shared" class="editonly"></div>
  <div class="bar">
    <select id="addPick"></select>
    <button id="add">Add axis set</button>
    <button id="undo" class="away">Undo</button>
  </div>
  <!-- wrap="off" 라야 긴 줄이 접히지 않고 가로로 스크롤된다 (§19.6) -->
  <textarea id="src" class="editonly" spellcheck="false" wrap="off"></textarea>
  <div class="bar editonly">
    <button id="run">Run</button>
  </div>
  <div id="err"></div>
  <fieldset id="sets"><legend>Axis sets</legend></fieldset>
  <div class="bar editonly vocabrow">
    <details id="vocab">
      <summary>Names in scope</summary>
      <div id="vocabList"></div>
    </details>
    <!-- docs/ 는 배포에 안 올라간다 (§19.13). GitHub 이 렌더한 쪽으로 건다.
         새 탭으로 열어야 쓰던 정의가 안 날아간다 -->
    <a id="docs" target="_blank" rel="noopener"
       href="https://github.com/loocookie/CutPatternExplorer/blob/main/docs/writing-definitions.md"
       >Writing definitions &#8599;</a>
  </div>
</aside>

<script src="app.js?v=e2f04a1f"></script>
<script>
"use strict";

const DEFAULT_SOURCE = `o1 = octahedron("Octahedron 1")
t1 = tetrahedron("Tetrahedron 1", turns=(15, 120, 135, -120, -105))

pair = lambda a: (a, at_angle(a, 180, o1)[0])

rd1 = rhombic_dodecahedron("Rhombic Dodecahedron 1")

with puzzle("Rose Diamond", o1, rd1) as p:
    split(o1)
    for i in range(4):
        x, y = pair(nearest(t1[f"t1-{i}"], o1))
        with turned(x, 15):
            with turned(y, 15):
                split(at_angle(x, 90, rd1, start=t1[f"t1-{(i+1)%4}"])[1::2])
`;

// 평가가 이만큼 끌면 Stop 을 내놓는다 (§19.15).
//
// 늘 두면 화면만 먹는다 — 몸통 정의는 밀리초대다 (§12.3). 아예 없으면 손으로
// 쓴 무거운 정의를 실행 모드에서 슬라이더로 밀다 멎었을 때 탈출구가 없다.
// 떠도 강제하는 것은 없다: 더 기다리고 싶으면 그냥 두면 된다.
const SLOW_MS = 5000;

// 새 축 집합이 얹혔을 때 쓸 절단 각도
const DEFAULT_ANGLE = 60;

// 기본 정의의 시작 각도. 정의마다 잘 보이는 각이 다르므로 60 하나로는 모자란다.
// 이름이 위 DEFAULT_SOURCE 의 puzzle() 인자와 어긋나면 조용히 무시되므로
// 테스트가 둘을 묶어 둔다
const DEFAULT_ANGLES = {
  "Octahedron 1": 90,
  "Rhombic Dodecahedron 1": 30,
};

// 조작 중 / 멎은 뒤 tessellation (§12.3). 조작 중에는 거칠게 그린다
const DRAG_STEP = 0.12;
const FINAL_STEP = 0.03;
const SETTLE_MS = 220;

const view = new SphereView(document.getElementById("c"));
// textarea 는 Tab 이 포커스 이동이다. 파이썬은 들여쓰기가 문법이라 그대로는
// 정의를 쓸 수 없다 (§19.6)
Editor.attach(document.getElementById("src"));
const els = {
  src: document.getElementById("src"), run: document.getElementById("run"),
  err: document.getElementById("err"),
  sets: document.getElementById("sets"), stat: document.getElementById("stat"),
  boot: document.getElementById("boot"), shared: document.getElementById("shared"),
  share: document.getElementById("share"), msg: document.getElementById("msg"),
  stop: document.getElementById("stop"),
  add: document.getElementById("add"), addPick: document.getElementById("addPick"),
  mode: document.getElementById("mode"),
  undo: document.getElementById("undo"),
};

// "축 집합 추가" 메뉴. 고르면 **코드를 쓴다** — 숨은 상태를 들고 있으면 메뉴로
// 시작해 손으로 이어 쓰는 길이 막히고, DSL 이 파이썬인 이유가 사라진다 (§19.9)
for (const [group, items] of Object.entries(globalThis.MENU || {})) {
  const optgroup = document.createElement("optgroup");
  optgroup.label = group;
  for (const [key, label] of items) optgroup.append(new Option(label, key));
  els.addPick.append(optgroup);
}

// 축 집합을 고치는 연산 (§19.12). 말줄임표는 "호출을 써 줄 테니 인자를 고쳐라"
const AXIS_OPS = [
  ["rotate", "Rotate…"],
  ["remove", "Remove an axis…"],
  ["rename", "Rename an axis…"],
  ["mirror", "Mirror…"],
  ["invert", "Invert"],
];

const engine = new Engine((msg) => { els.boot.textContent = msg; els.boot.style.display = msg ? "grid" : "none"; });
let angles = {};
let info = null;

// 실행 모드와 편집 모드 (§19.15).
//
// 편집 모드에서는 편집밖에 못 한다 — 코드, 실행, 어휘 목록. 실행 모드는 축
// 집합을 켜고 끄고 각도를 미는 자리다. "간단 모드" 가 아니다: 간단한 것은
// 축을 더하는 일이지 실행 모드 자체가 아니다.
//
// **오류는 두 모드에 다 보인다.** 손으로 쓴 정의를 실행 모드에서 슬라이더로
// 밀다 죽을 수 있고, 갈 곳 없는 오류는 없는 오류보다 나쁘다.
//
// 기본은 실행 모드다. 다만 **링크로 받은 정의는 편집 모드로 연다** — 아래
// start() 를 보라 (§19.4).
let mode = "run";

// 마지막으로 그린 절단 장면. 편집 모드에 들어갔다 나올 때 다시 평가하지 않고
// 그대로 되돌려 놓는다 — 편집 중에 퍼즐이 바뀌면 안 되고 (§19.15), 안 바뀌었
// 으면 다시 계산할 이유도 없다
let lastCutScene = null;

// 감춘 축 집합. **무대마다 따로 기억한다** (§19.15).
//
// 체크박스는 하나이고 뜻도 하나다 — "지금 보고 있는 무대에서 이 집합을
// 감춘다". 무대가 둘이니 기억도 둘이다. 하나로 합치면, 편집 모드에서 어수선
// 해서 마커를 껐는데 Run 했더니 절단까지 사라져 있는 일이 생긴다. 그건 버그로
// 보인다.
//
// **인덱스가 아니라 id 로 들고 있는다.** 두 무대의 축 집합 목록이 다르고
// (절단은 그려지는 것만, 마커는 전부), 인덱스로 들면 목록을 다시 그릴 때마다
// 어느 것이 꺼져 있었는지가 사라진다.
const hiddenIn = { run: new Set(), edit: new Set() };

// 지금 무대에 올라간 장면의 축 집합 목록. **색과 감춤을 이것이 정한다.**
//
// 무대마다 목록이 다르다 — 절단 장면에는 `puzzle()` 인자만, 마커 장면에는
// 이름 공간의 모든 집합이 있다 (§19.12). 옆칸의 색을 `info.axisSets` 로
// 세면 편집 모드에서 어긋난다: 기준으로만 쓰는 집합이 마커 장면에서는 한
// 칸을 차지하므로, 그 뒤가 통째로 한 칸씩 밀려 다른 색이 된다
let stageSets = [];

// 축 집합 id 를 팔레트 자리로. **정의가 정하고 무대가 못 바꾼다** (§11.5).
//
// 무대마다 목록이 다르므로 (절단은 `puzzle()` 인자만, 마커는 전부) 무대에서
// 세면 같은 집합이 실행 모드와 편집 모드에서 다른 색이 된다. 마커를 보고
// 고른 축이 Run 하면 다른 색으로 나오는 셈이라 못 쓴다.
//
// 정의의 축 집합 목록(`info.sets`, 이름 공간에 묶인 순서)으로 센다. 두 무대가
// **같은 목록**을 주므로 색이 무대를 안 탄다
let colorOrder = [];

/** 정의를 읽었다. 색 순서는 여기서 한 번 정해진다. */
function setColorOrder(sets) {
  colorOrder = sets.map((s) => s.id);
}

function colorSlot(id) {
  const i = colorOrder.indexOf(id);
  if (i >= 0) return i;
  // 정의에 이름이 없는 집합. `puzzle("p", merge(a, b))` 처럼 쓰면 이름 공간에
  // 안 묶여 목록에 없다. 본 순서대로 뒤에 붙인다
  colorOrder.push(id);
  return colorOrder.length - 1;
}

/** 장면을 무대에 올린다. id 로 든 것을 이 장면의 인덱스로 옮긴다 (§11.5). */
function putOnStage(scene) {
  stageSets = scene.axisSets;
  view.colors = scene.axisSets.map(colorSlot);
  view.hidden.clear();
  scene.axisSets.forEach((id, i) => {
    if (hiddenIn[mode].has(id)) view.hidden.add(i);
  });
  view.setScene(scene);
}

/** 무대에 무엇을 그릴지는 **모드가 정한다** (§19.15).
 *
 * 실행 모드는 절단 패턴, 편집 모드는 축 마커다. 둘을 같이 띄우지 않는다 —
 * 편집 중에 절단이 같이 보이면 지금 무엇을 고치는 중인지가 흐려지고, 어차피
 * 절단은 `Run` 전까지 바뀌지 않는다.
 */
async function drawStage() {
  if (mode === "edit" && engine.ready && live) {
    try {
      const out = await engine.axisScene(els.src.value);
      // 색 순서를 무대보다 **먼저** 잡는다. putOnStage 가 그걸로 색을 만든다
      setColorOrder(out.sets);
      putOnStage(out.scene);
      // 목록은 마커와 **같은 실행**에서 온다. 따로 가져오면 어긋난다
      if (info) { info.sets = out.sets; buildAxisSets(); }
    } catch (e) {
      // **타이핑 중에는 늘 깨져 있다** (§19.9). 직전 마커를 그대로 두고
      // 넘어간다 — 글자를 칠 때마다 빨간 칸이 깜빡이면 못 쓴다. 오류는
      // Run 을 눌렀을 때 뜬다.
      //
      // 다만 삼키기만 하면 배선이 끊겼을 때도 조용해진다. 콘솔에는 남긴다
      console.debug("axis markers:", e && e.message ? e.message : e);
    }
  } else if (mode === "edit") {
    console.debug("axis markers: skipped", { ready: engine.ready, live });
  } else if (lastCutScene) {
    // **여기서 목록을 다시 그리면 안 된다.** 슬라이더를 미는 것이 곧
    // 다시 그리는 것이라 (input -> refresh -> drawStage), 목록을 갈아
    // 끼우면 지금 잡고 있는 <input> 이 DOM 에서 사라져 포인터가 놓인다.
    // 클릭은 한 번에 끝나니 멀쩡해 보이고 미는 것만 안 된다.
    //
    // 목록은 **목록이 바뀔 때** 그린다: 정의를 읽었을 때(run), 편집 중
    // 실시간 갱신 때, 모드가 바뀌었을 때(setMode). 그림이 바뀔 때가 아니다
    putOnStage(lastCutScene);
  }
}

// 편집창을 고치면 마커가 따라 움직인다 (§19.15).
//
// **타이핑에 반응한다는 것은 곧 실행한다는 뜻이다.** 링크로 받은 코드가 글자
// 하나 쳤다고 도는 것은 §19.4 의 "사람이 읽고 누른다" 를 뒤에서 무너뜨린다.
// 그래서 첫 Run 전까지는 안 돈다 — 그 Run 이 동의다. 우리가 쓴 기본 정의는
// 처음에 자동 실행되므로 바로 켜진다.
let live = false;
let typeTimer = null;
const TYPE_MS = 400;

async function setMode(next) {
  mode = next;
  for (const el of document.querySelectorAll(".editonly")) el.hidden = next !== "edit";
  els.mode.textContent = next === "edit" ? "Close editor" : "Edit definition";
  // 줄 내용이 모드마다 다르다 — Edit… 와 × 는 편집 모드 것이고 슬라이더는
  // 실행 모드 것이다. **무대를 바꾼 뒤에** 그린다: 어느 집합이 색칠되고 어느
  // 집합이 회색인지를 지금 무대(stageSets)가 정하기 때문이다
  await drawStage();
  if (info) buildAxisSets();
}

els.mode.onclick = () => setMode(mode === "edit" ? "run" : "edit");

// 버튼 글자를 마크업과 코드 두 곳에 두지 않는다. 시작할 때 한 번 돌린다
setMode(mode);
let settleTimer = null;

function fail(e) {
  els.err.style.display = "block";
  els.err.textContent = String(e && e.message ? e.message : e);
}

function clearError() { els.err.style.display = "none"; els.err.textContent = ""; }

// 메뉴가 고친 것을 한 칸만 되돌린다 (§19.15).
//
// `×` 는 축 집합만이 아니라 **그것을 쓰는 문장을 전부** 데려간다 (§19.9).
// 편집 모드에서는 편집창의 브라우저 되돌리기가 탈출구인데 (§19.6) 실행 모드
// 에는 편집창이 없다. 코드를 안 보는 사람이 무엇이 사라졌는지 모른 채
// 되돌릴 수도 없게 된다.
//
// 손으로 편집창을 고치면 이 칸을 비운다. 거기서부터는 브라우저 되돌리기가
// 맡고, 두 되돌리기가 겹치면 어느 쪽이 이겼는지 안 보인다.
let undoSource = null;

function remember(source) {
  undoSource = source;
  els.undo.classList.remove("away");
}

function forgetUndo() {
  undoSource = null;
  els.undo.classList.add("away");
}

els.undo.onclick = async () => {
  if (undoSource === null) return;
  rewrite(undoSource);
  forgetUndo();
  clearError();
  await run();
};

// 메뉴가 고친 코드를 편집창에 되쓴다 (§19.9). `.value =` 로 통째 대입하면
// 되돌리기 기록이 날아간다 — 잘못 지웠을 때 되돌릴 길이 없어진다.
// setRangeText 는 기록에 남는다 (editor.js 가 쓰는 것과 같은 기계)
function rewrite(text) {
  // 실행 모드에서는 편집창이 숨어 있다. 숨은 것에 focus 를 주면 아무 일도
  // 안 일어나지만, 굳이 부르지 않는다 (§19.15)
  if (!els.src.hidden) els.src.focus();
  els.src.setRangeText(text, 0, els.src.value.length, "end");
}

// 평가가 worker 에서 도므로 여기서 기다려도 UI 가 안 멈춘다. 다만 슬라이더가
// 평가보다 빨리 움직이므로, 도는 중이면 마지막 요청만 남겨 두고 합친다
let inFlight = false;
let queued = null;

let slowTimer = null;

/** 평가가 도는 동안 모드 전환을 막고 그 사실을 말한다 (§19.15). */
function bind(on) {
  els.mode.disabled = on;
  els.run.disabled = on;
  els.msg.textContent = on ? "Rendering…" : "";
}

/** 평가를 감싼다. 오래 끌면 Stop 이 나타나고, 끝나면 도로 숨는다. */
function watchSlow(on) {
  clearTimeout(slowTimer);
  slowTimer = null;
  if (on) {
    slowTimer = setTimeout(() => { els.stop.hidden = false; }, SLOW_MS);
  } else if (!engine.running) {
    els.stop.hidden = true;
  }
}

async function refresh(maxStep) {
  if (inFlight) { queued = maxStep; return; }
  inFlight = true;
  watchSlow(true);
  try {
    const t0 = performance.now();
    const out = await engine.evaluate(angles, maxStep);
    const ms = performance.now() - t0;
    lastCutScene = out.scene;
    await drawStage();
    const hidden = [...hiddenIn.run];
    els.stat.textContent =
      `carriers ${out.carriers}  polylines ${out.scene.starts.length}  ` +
      `arc length ${out.length.toFixed(3)}  eval ${ms.toFixed(0)}ms` +
      // 0 과 180 은 퇴화원이라 자를 것이 없다. 남는 폴리라인은 축 마커뿐인데
      // 그것만 보이면 고장난 것처럼 읽힌다 (§14)
      (out.carriers === 0 ? "  |  no cuts (0° and 180° have zero radius)" : "") +
      (out.note ? `  |  ${out.note}` : "") +
      (hidden.length ? `  |  hidden: ${hidden.join(", ")} (the material is still there)` : "");
    clearError();
  } catch (e) {
    fail(e);
  } finally {
    inFlight = false;
    watchSlow(false);
    if (queued !== null) { const next = queued; queued = null; refresh(next); }
  }
}

function scheduleFinal() {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => refresh(FINAL_STEP), SETTLE_MS);
}

/** 각도 슬라이더 한 줄 (§19.8). 그려지는 집합에만 붙는다. */
function angleRow(id) {
  const row = document.createElement("div");
  row.className = "row";
  const name = document.createElement("b");
  const val = document.createElement("span");
  val.className = "val";
  val.title = "Click to type an exact value";
  // 집합 이름은 바로 윗줄에 있다. 여기서 되풀이하지 않는다
  name.append(val);

  const range = document.createElement("input");
  // 0 과 180 은 퇴화원이다 (r = 0). 터지지 않고 "자를 게 없는 상태" 로
  // 나온다 — RADIUS_EPS 판정이 split 과 build_arcs 에서 걸러 낸다 (§14)
  range.type = "range"; range.min = 0; range.max = 180; range.step = 0.05;
  range.value = angles[id];

  const show = () => { val.textContent = Number(angles[id]).toFixed(4) + "°"; };

  const setAngle = (value, coarse) => {
    const next = Math.min(180, Math.max(0, Number(value)));
    if (!Number.isFinite(next)) return;
    angles[id] = next;
    range.value = next;
    show();
    refresh(coarse ? DRAG_STEP : FINAL_STEP);
    if (coarse) scheduleFinal();
  };

  range.oninput = () => setAngle(range.value, true);

  // 숫자를 눌러 그 자리에서 고친다. 슬라이더는 스텝이 0.05 라 정다면체의
  // 특징적인 각(63.4349 등)에 닿을 수 없다 (§19.8)
  val.onclick = () => {
    const box = document.createElement("input");
    box.type = "number"; box.className = "num";
    box.min = 0; box.max = 180; box.step = "any";
    box.value = Number(angles[id]).toFixed(4);
    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      box.replaceWith(val);
      if (commit) setAngle(box.value, false);
    };
    box.onkeydown = (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
      else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
    };
    box.onblur = () => finish(true);
    val.replaceWith(box);
    box.focus();
    box.select();
  };

  show();
  row.append(name, range);
  return row;
}

// 축 집합 하나가 한 줄이다 (§19.15).
//
// 전에는 "Cut angle" 과 "Axis sets" 가 따로였다. 나뉜 이유는 **각도가 없는 축
// 집합이 있어서**였는데 (기준으로만 쓰는 것, §19.12), 그건 슬라이더 칸을
// 비우면 될 일이지 목록을 둘로 만들 이유가 아니었다. 실제로 나뉜 이유는 `×`
// 를 어디 둘지였고 그건 이미 정해졌다.
function buildAxisSets() {
  els.sets.replaceChildren(Object.assign(document.createElement("legend"), { textContent: "Axis sets" }));
  // 그려지는 것만이 축 집합의 전부가 아니다. 기준으로만 쓰는 집합도 고치고
  // 지울 수 있어야 한다 (§19.12)
  //
  // **빈 목록과 목록 없음은 다르다.** 길이로 판정하면 편집창을 비웠을 때
  // (실시간 갱신이 빈 목록을 준다) 마지막 Run 의 axisSets 로 되돌아가, 이미
  // 사라진 집합이 유령으로 남는다. 그 줄의 × 는 없는 이름을 찾다 죽는다
  const sets = Array.isArray(info.sets)
    ? info.sets : info.axisSets.map((id) => ({ id, axes: [] }));

  for (const set of sets) {
    const drawn = info.axisSets.indexOf(set.id);
    // 무대에 있는가. 없으면 (아직 한 번도 안 그렸거나, 실행 모드의 기준
    // 전용 집합) 절단 목록으로 물러선다
    const onStage = stageSets.indexOf(set.id);
    const shown = onStage >= 0 || drawn >= 0;
    const cell = document.createElement("div");
    cell.className = "set";
    const row = document.createElement("div");
    row.className = "setrow";

    const sw = document.createElement("span");
    sw.className = "sw";
    // 체크박스 하나가 **지금 보고 있는 무대**에서 감출지를 정한다 (§19.15).
    // 실행 모드면 절단, 편집 모드면 마커다. 기억은 무대마다 따로다.
    //
    // 절단은 puzzle() 인자에만 있고 마커는 모든 집합에 있으므로, 끌 수 있는
    // 줄도 모드마다 다르다
    const togglable = mode === "edit" || drawn >= 0;
    if (togglable) {
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = !hiddenIn[mode].has(set.id);
      box.title = mode === "edit"
        ? "Hide these axis markers"
        : "Hide this axis set (the material is still there)";
      box.onchange = () => {
        box.checked ? hiddenIn[mode].delete(set.id) : hiddenIn[mode].add(set.id);
        drawStage();
        if (mode === "run") refresh(FINAL_STEP);
      };
      row.append(box);
    }
    if (shown) {
      // 옆칸과 화면이 **같은 자리**에서 색을 고른다 (§11.5)
      sw.style.background = `rgb(${PALETTE[colorSlot(set.id) % PALETTE.length]})`;
    } else {
      sw.className = "sw off";
      sw.title = "Not passed to puzzle(...), so it is not drawn";
    }
    row.append(sw);

    const name = document.createElement("span");
    name.className = "nm";
    name.textContent = set.id;
    name.title = set.axes.length ? set.axes.length + " axes: " + set.axes.join(", ") : set.id;
    row.append(name);

    // 메뉴가 **호출을 써 준다.** 이 이름들은 진작 있었는데 아무도 몰랐다.
    // 부르는 대신 써 주면 다음부터는 손으로 쓸 수 있다 (§19.12)
    const pick = document.createElement("select");
    pick.append(new Option("Edit…", ""));
    for (const [op, label] of AXIS_OPS) pick.append(new Option(label, op));
    pick.onchange = async () => {
      const op = pick.value;
      pick.value = "";
      if (!op) return;
      if (!engine.ready) { fail("The engine is not running. Reload the page."); return; }
      try {
        remember(els.src.value);
        rewrite(await engine.axisOp(els.src.value, set.id, op));
        clearError();
        await run();
      } catch (e) { fail(e); }
    };
    // `rotate`/`mirror`/`invert` 는 **결과를 봐야** 뜻이 있는 연산이라
    // 편집 모드 것이다 (§19.15). 지우기는 넣기와 대칭이므로 두 모드에 다 있다
    if (mode === "edit") row.append(pick);

    // 지우기는 딸린 코드까지 데려간다 (§19.9). 되돌리기 한 칸이 받쳐 준다
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.title = "Remove this axis set and everything that uses it";
    del.onclick = async () => {
      if (!engine.ready) { fail("The engine is not running. Reload the page."); return; }
      try {
        remember(els.src.value);
        rewrite(await engine.removeAxisSet(els.src.value, set.id));
        clearError();
        await run();
      } catch (e) { fail(e); }
    };
    row.append(del);

    cell.append(row);
    // 각도가 없는 집합은 슬라이더 칸이 빈다. 그것이 이 둘을 합칠 수 있는 이유다.
    // 편집 모드에는 아예 없다 — 절단이 무대에 없으니 밀어도 보이는 것이 안
    // 바뀐다 (§19.15)
    if (mode === "run" && info.inputs.includes(set.id)) cell.append(angleRow(set.id));
    els.sets.append(cell);
  }
}

// 아무것도 없는 정의. 마지막 축 집합을 지우면 여기로 온다
const EMPTY_SCENE = {
  xyz: new Float64Array(0), starts: [], counts: [],
  groups: [], kinds: [], labels: [], axisSets: [],
};

/** 화면을 비운다. 그릴 것이 없는 상태도 정상이다. */
function clearStage() {
  info = null;
  lastCutScene = null;
  colorOrder = [];
  els.sets.replaceChildren(Object.assign(document.createElement("legend"),
    { textContent: "Axis sets" }));
  els.stat.textContent = "";
  putOnStage(EMPTY_SCENE);
}

async function run() {
  if (!engine.ready) {
    fail("The engine is not running. Reload the page.");
    return;
  }
  // **빈 정의는 오류가 아니다.** 마지막 축 집합을 `×` 로 지우면 `with puzzle`
  // 블록째 사라져 (§19.9) 소스가 빈다. 그것을 prepare 에 넘기면 "no puzzle
  // block" 으로 죽고, run 이 던지면 목록이 다시 안 그려져 지운 슬라이더가
  // 화면에 남는다. 손으로 다 지운 경우도 마찬가지다 — 둘 다 실수가 아니다.
  //
  // 비어 있지 않은데 puzzle 블록이 없는 경우는 그대로 오류다. 그 메시지는
  // `return p` 로 끝낸 사람을 가르치는 자리다 (§19.7)
  if (!els.src.value.trim()) {
    clearStage();
    clearError();
    return;
  }
  try {
    // 끝날 때까지 모드를 못 바꾸게 한다 (§19.15). 평가 도중에 화면이 바뀌면
    // 무엇이 그려지는 중인지 안 보이고, 멎었을 때 어느 정의가 멎은 것인지도
    // 흐려진다. 실행 모드로 나가는 것은 결과를 본 뒤다
    bind(true);
    watchSlow(true);
    info = await engine.prepare(els.src.value);
    setColorOrder(info.sets);
    // **모든 절단 입력에 각도가 있어야 evaluate 가 돈다** (§13). 슬라이더를
    // 만들 때 채우면 슬라이더가 없는 자리에서 비어 있게 된다 — 편집 모드에는
    // 슬라이더가 없으므로 (§19.15) 거기서 축을 얹으면 그대로 죽는다:
    //
    //     KeyError: no cut angle given for: ['Tetrahedron 1']
    //
    // 화면이 아니라 정의가 정하는 것이므로 정의를 읽은 자리에서 채운다
    for (const id of info.inputs) {
      if (angles[id] === undefined) angles[id] = DEFAULT_ANGLE;
    }
    clearError();
    els.shared.style.display = "none";
    buildAxisSets();
    await refresh(FINAL_STEP);
    live = true;   // 한 번 돌렸다. 이제 타이핑에 반응해도 된다 (§19.4)
  } catch (e) { fail(e); }
  finally { watchSlow(false); bind(false); }
}

// 무한 루프에 빠진 정의를 죽인다. worker 가 아니면 할 수 없는 일이다 (§19.5)
els.stop.onclick = async () => {
  engine.stop();
  els.stop.hidden = true;
  queued = null; inFlight = false;
  fail("Stopped. Restarting the engine…");
  try {
    await engine.boot();
  } catch (e) {
    // 재부팅이 실패하면 "중지했다" 가 그대로 남아 원인을 가린다
    fail("Could not restart the engine: " + e.message);
    return;
  }
  clearError();
  els.msg.textContent = "Engine restarted";
  setTimeout(() => { els.msg.textContent = ""; }, 4000);
};

// ---- 공유 링크 (§19.4) ------------------------------------------------

els.share.onclick = async () => {
  // info.inputs 로 걸러 낸다. angles 는 세션 동안 지운 축 집합의 옛 각도까지
  // 쌓일 수 있는데 (§13), 그걸 그대로 실으면 링크에 죽은 이름이 남는다.
  // info 가 아직 없으면(한 번도 Run 을 안 했으면) 각도 없이 코드만 싣는다
  const shareAngles = {};
  if (info) for (const id of info.inputs) {
    if (angles[id] !== undefined) shareAngles[id] = angles[id];
  }
  const link = await Share.shareLink(els.src.value, location.href, shareAngles);
  try {
    await navigator.clipboard.writeText(link);
    els.msg.textContent = `Copied (${link.length} chars)`;
  } catch (_) {
    // 클립보드가 막힌 환경이면 주소창에라도 남긴다
    location.hash = link.split("#")[1];
    els.msg.textContent = "Put it in the address bar — copy from there";
  }
  if (link.length > Share.SAFE_URL_LENGTH) {
    els.msg.textContent += " — long enough that it may get truncated";
  }
  setTimeout(() => { els.msg.textContent = ""; }, 4000);
};

els.add.onclick = async () => {
  if (!engine.ready) { fail("The engine is not running. Reload the page."); return; }
  try {
    remember(els.src.value);
    rewrite(await engine.addAxisSet(els.src.value, els.addPick.value));
    clearError();
    await run();
  } catch (e) { fail(e); }
};

// **`Run` 은 결과를 보러 나가는 버튼이다** (§19.15). 메뉴가 부르는 run() 은
// 편집 모드에 남는다 — 축을 하나 고칠 때마다 화면이 튀면 못 쓴다
els.run.onclick = async () => {
  await run();
  if (engine.ready) await setMode("run");
};

// 손으로 한 글자라도 고치면 메뉴 되돌리기는 버린다 (§19.15). 두 되돌리기가
// 겹치면 어느 쪽이 이겼는지 안 보인다
els.src.oninput = () => {
  forgetUndo();
  // 글자마다 실행하지 않는다. 멎으면 그린다
  clearTimeout(typeTimer);
  typeTimer = setTimeout(() => { drawStage(); }, TYPE_MS);
};
els.src.onkeydown = (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
};
// window resize 는 창 크기만 본다. 패널이나 폰트 변화로 캔버스만 바뀌는 경우를
// 놓치므로 요소를 직접 관찰한다
new ResizeObserver(() => view.draw()).observe(document.getElementById("stage"));

// 링크로 받은 정의는 **실행하지 않는다.** 편집창에 채워만 넣고 사람이 읽고
// 누른다. 링크를 여는 것이 곧 임의 코드 실행이 되면 안 된다 (§19.4)
// 이름이 마법처럼 존재하면 무엇을 쓸 수 있는지 알 길이 없다. 암묵 import 의
// 값이자 대가다 (§19.7).
//
// vocab.js 는 번들을 만들 때 같은 __all__ 에서 뽑아 둔 정적 데이터다. worker 를
// 거쳐 가져오면 비동기, 메시지 왕복, Pyodide 의 타입 변환이 끼어드는데 그중
// 하나만 어긋나도 목록이 조용히 빈다. Pyodide 를 기다릴 이유도 없다
function showVocabulary() {
  const box = document.getElementById("vocabList");
  box.replaceChildren();
  const groups = globalThis.VOCAB;
  if (!groups) {
    box.textContent = "vocab.js is missing. Run: python web/bundle_engine.py";
    return;
  }
  for (const [group, items] of Object.entries(groups)) {
    const head = document.createElement("div");
    head.className = "grp";
    head.textContent = `${group} (${items.length})`;
    const body = document.createElement("code");
    body.textContent = items.join(", ");
    box.append(head, body);
  }
}
showVocabulary();   // Pyodide 와 무관하다. 바로 보인다

async function start() {
  let shared = null;
  try {
    shared = await Share.sourceFromHash(location.hash);
  } catch (e) {
    fail("Could not read the definition from the link: " + e.message);
  }

  // 편집창부터 채운다. 부팅이 실패해도 코드는 보여야 하고, 링크로 받은 정의가
  // 사라지면 안 된다
  if (shared === null) {
    els.src.value = DEFAULT_SOURCE;
    Object.assign(angles, DEFAULT_ANGLES);
  } else {
    els.src.value = shared;
    // 각도는 코드와 별도 조각이다. 없거나 손상됐으면 null — 코드를 읽는 것을
    // 막지 않는다. 슬라이더가 처음 생기는 자리(각도를 시드하는 곳)가 이 값을
    // 기본값보다 먼저 본다
    Object.assign(angles, Share.anglesFromHash(location.hash) || {});
    // **링크는 편집 모드로 연다.** §19.4 의 안전 근거는 "사람이 읽고 누른다"
    // 하나다. 실행 모드에서 열면 읽어야 할 코드가 접혀 있어, 경고만 뜨고
    // 정작 읽을 것이 안 보인다 — 지금보다 나빠진다
    setMode("edit");
    els.shared.style.display = "block";
    els.shared.textContent =
      "Loaded a definition from the link. This is Python written by someone " +
      "else and it runs in your browser. Read it, then press Run.";
  }

  await engine.boot();

  // 받은 정의는 자동 실행하지 않는다 (§19.4). 우리가 쓴 기본 정의만 돌린다
  if (shared === null) run();
}

start().catch((e) => { els.boot.style.display = "none"; fail(e); });
</script>
