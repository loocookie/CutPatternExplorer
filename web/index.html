<!doctype html>
<meta charset="utf-8">
<title>Cut Pattern Explorer</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px ui-sans-serif, system-ui, sans-serif;
    background: #fbfbfd; color: #1b1e26;
    display: grid; grid-template-columns: 1fr 340px; height: 100vh;
  }
  #stage { position: relative; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #stat { position: absolute; left: 16px; bottom: 12px; right: 16px;
          color: #7b8194; font-size: 12px; line-height: 1.5; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center;
          color: #7b8194; background: #fbfbfd; }
  aside { border-left: 1px solid #e3e6ee; padding: 16px; overflow-y: auto;
          display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 13px; margin: 0; letter-spacing: .02em; color: #5b6172; }
  textarea { width: 100%; height: 220px; padding: 10px; resize: vertical;
             font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
             border: 1px solid #dfe3ec; border-radius: 6px; background: #fff;
             tab-size: 4; }
  button { padding: 7px 14px; border: 1px solid #c9cfdd; border-radius: 6px;
           background: #fff; cursor: pointer; font: inherit; }
  button:hover { background: #f2f4f9; }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-size: 12px; color: #7b8194; padding: 0 0 6px; }
  .row { display: grid; grid-template-columns: 1fr; gap: 2px; margin-bottom: 10px; }
  .row b { font-weight: 500; font-size: 12px; color: #4a5163; }
  input[type=range] { width: 100%; }
  label.tog { display: block; margin: 4px 0; cursor: pointer; font-size: 13px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
        margin-right: 6px; vertical-align: -1px; }
  #err { color: #b3261e; font: 12px/1.5 ui-monospace, monospace;
         white-space: pre-wrap; display: none; }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="stat"></div>
  <div id="boot">시작하는 중…</div>
</div>

<aside>
  <h1>Cut Pattern Explorer</h1>
  <textarea id="src" spellcheck="false"></textarea>
  <div><button id="run">실행</button></div>
  <div id="err"></div>
  <fieldset id="sliders"><legend>절단 각도</legend></fieldset>
  <fieldset id="sets"><legend>축 집합</legend></fieldset>
  <fieldset>
    <label class="tog"><input type="checkbox" id="mk" checked> 축 마커</label>
    <label class="tog"><input type="checkbox" id="lb" checked> 축 라벨</label>
  </fieldset>
</aside>

<script src="engine.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
<script>
"use strict";

const DEFAULT_SOURCE = `from cutpattern import solids as S
from cutpattern.dsl import at_angle, puzzle, split, turned

faces = S.cube("faces", turns=(45, -45, 90, -90, 180))

with puzzle("OctoCube Master", faces) as p:
    split(faces)
    for x in faces:
        with turned(x, 45):
            split(*at_angle(x, 90, faces))
`;

// 조작 중 / 멎은 뒤 tessellation (§12.3). 조작 중에는 거칠게 그린다
const DRAG_STEP = 0.12;
const FINAL_STEP = 0.03;
const SETTLE_MS = 220;

const view = new SphereView(document.getElementById("c"));
const els = {
  src: document.getElementById("src"), run: document.getElementById("run"),
  err: document.getElementById("err"), sliders: document.getElementById("sliders"),
  sets: document.getElementById("sets"), stat: document.getElementById("stat"),
  boot: document.getElementById("boot"),
};
els.src.value = DEFAULT_SOURCE;

const engine = new Engine((msg) => { els.boot.textContent = msg; els.boot.style.display = msg ? "grid" : "none"; });
let angles = {};
let info = null;
let settleTimer = null;
let pending = false;

function fail(e) {
  els.err.style.display = "block";
  els.err.textContent = String(e && e.message ? e.message : e);
}

function clearError() { els.err.style.display = "none"; els.err.textContent = ""; }

function refresh(maxStep) {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    try {
      const t0 = performance.now();
      const out = engine.evaluate(angles, maxStep);
      const ms = performance.now() - t0;
      view.setScene(out.scene);
      const hidden = [...view.hidden].map((i) => out.scene.axisSets[i]);
      els.stat.textContent =
        `carrier ${out.carriers}  폴리라인 ${out.scene.starts.length}  ` +
        `총 호 길이 ${out.length.toFixed(3)}  평가 ${ms.toFixed(0)}ms` +
        (out.note ? `  |  ${out.note}` : "") +
        (hidden.length ? `  |  숨긴 축 집합: ${hidden.join(", ")} (재료는 그대로 있다)` : "");
      clearError();
    } catch (e) { fail(e); }
  });
}

function scheduleFinal() {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => refresh(FINAL_STEP), SETTLE_MS);
}

function buildSliders() {
  els.sliders.replaceChildren(Object.assign(document.createElement("legend"), { textContent: "절단 각도" }));
  for (const id of info.inputs) {
    if (angles[id] === undefined) angles[id] = 60;
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("b");
    const range = document.createElement("input");
    range.type = "range"; range.min = 0.01; range.max = 179.99; range.step = 0.05;
    range.value = angles[id];
    const show = () => { name.textContent = `${id}   ${Number(range.value).toFixed(2)}°`; };
    range.oninput = () => {
      angles[id] = Number(range.value);
      show(); refresh(DRAG_STEP); scheduleFinal();
    };
    show();
    row.append(name, range);
    els.sliders.append(row);
  }
}

function buildToggles() {
  els.sets.replaceChildren(Object.assign(document.createElement("legend"), { textContent: "축 집합" }));
  view.hidden.clear();
  info.axisSets.forEach((id, i) => {
    const label = document.createElement("label");
    label.className = "tog";
    const box = document.createElement("input");
    box.type = "checkbox"; box.checked = true;
    box.onchange = () => {
      box.checked ? view.hidden.delete(i) : view.hidden.add(i);
      view.draw(); refresh(FINAL_STEP);
    };
    const sw = document.createElement("span");
    sw.className = "sw";
    sw.style.background = `rgb(${PALETTE[i % PALETTE.length]})`;
    label.append(box, sw, document.createTextNode(id));
    els.sets.append(label);
  });
}

function run() {
  try {
    info = engine.prepare(els.src.value);
    clearError();
    buildSliders();
    buildToggles();
    refresh(FINAL_STEP);
  } catch (e) { fail(e); }
}

els.run.onclick = run;
els.src.onkeydown = (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
};
document.getElementById("mk").onchange = (e) => { view.showMarkers = e.target.checked; view.draw(); };
document.getElementById("lb").onchange = (e) => { view.showLabels = e.target.checked; view.draw(); };
addEventListener("resize", () => view.draw());

engine.boot().then(run).catch((e) => { els.boot.style.display = "none"; fail(e); });
</script>
